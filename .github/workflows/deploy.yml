name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_EC2_IP }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_EC2_PRIVATE_KEY }}
          port: ${{ secrets.AWS_EC2_PORT || 22 }}
          script_stop: true
          script: |
            set -e

            # Ensure common binary paths are in PATH (for pm2, node, python)
            export PATH=$PATH:/usr/local/bin:/usr/bin
            if [ -d "$HOME/.nvm" ]; then
              export NVM_DIR="$HOME/.nvm"
              [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            fi

            # Navigate to the project directory on EC2
            cd ~/Personal-Agent

            # 1. Pull the latest code
            echo "Pulling latest code from main..."
            git pull origin main

            # 2. Update Python dependencies in the virtual environment
            echo "Updating Python dependencies..."
            cd api
            ./venv/bin/pip install -r requirements.txt
            cd ..

            # 3. Reload or start only the FastAPI app via PM2
            echo "Reloading FastAPI app via PM2..."
            pm2 startOrReload ecosystem.config.cjs --only agent-api --update-env
            pm2 save

            echo "Deployment completed successfully!"